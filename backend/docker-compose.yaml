services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: phoenix-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: phoenix-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: ./
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "3001:3000"
    environment:
      - SERVICE=api-gateway
      - USER_PROTO_PATH=${USER_PROTO_PATH}
      - USER_SERVICE_URL=${USER_SERVICE_URL}
      - INGESTION_SERVICE_URL=${INGESTION_SERVICE_URL}
      - STORAGE_SERVICE_URL=${STORAGE_SERVICE_URL}
      - STORAGE_PROTO_PATH=${STORAGE_PROTO_PATH}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - NODE_ENV=${NODE_ENV}
      - SWAGGER_SERVER_URL=${SWAGGER_SERVER_URL}
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_JWT_REFRESH_SECRET=${AUTH_JWT_REFRESH_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node -r tsconfig-paths/register dist/api-gateway/src/app.js"

  user-service:
    build:
      context: ./
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "50051:50051"
    environment:
      - SERVICE=user-service
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=3000
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_JWT_REFRESH_SECRET=${AUTH_JWT_REFRESH_SECRET}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node -r tsconfig-paths/register dist/user-service/src/app.js"

  data-ingestion-service:
    build:
      context: ./
      dockerfile: data-ingestion-service/Dockerfile
    container_name: ingestion-service
    ports:
      - "50053:50053"
    environment:
      - SERVICE=data-ingestion-service
      - INGESTION_PROTO_PATH=${INGESTION_PROTO_PATH}
      - INGESTION_SERVICE_PORT=50053
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=3000
      - PYTHON_BIN=/app/.venv/bin/python
      - CORE_MODEL_SCRIPT_PATH=${CORE_MODEL_SCRIPT_PATH}
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node -r tsconfig-paths/register dist/data-ingestion-service/src/app.js"
  storage-service:
    build:
      context: ./
      dockerfile: storage-service/Dockerfile
    container_name: storage-service
    ports:
      - "50054:50054"
    environment:
      - SERVICE=storage-service
      - STORAGE_PROTO_PATH=${STORAGE_PROTO_PATH}
      - STORAGE_SERVICE_PORT=50054
      - SUPABASE_CONNECTION_STRING=${SUPABASE_CONNECTION_STRING}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node -r tsconfig-paths/register dist/storage-service/src/app.js"
